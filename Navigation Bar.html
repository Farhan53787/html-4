<html>
    <head>
        <title>Navbar</title>
        <style>
            body {
                font-family: comic sans ms, cursive;
            }
            .topnav {
                overflow: hidden;
                background-color: #333;
            }
            .topnav a {
                float: left;
                color: #f2f2f2;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
            .topnav a:hover {
                background-color: #ddd;
                color: black;
            }
             .topnav a.active {
                background-color: #04AA6D;
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="#home">Home</a>
            <a href="#about">About Us</a>
            <a href="#services">Gallery</a>
            <a href="#contact">Contact Us</a>
        </div>
    </body>
    </html>
